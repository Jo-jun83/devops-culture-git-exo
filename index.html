<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Site</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #222;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .hero {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 30px;
            color: #555;
        }

        .hero a {
            background-color: #222;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
        }

        .hero a:hover {
            background-color: #444;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #222;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h2>Mon Site</h2>

        <nav>
            <a href="#">Accueil</a>
            <a href="#about">À propos</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Bienvenue sur mon site</h1>

            <p>
                Une page d'accueil simple réalisée en HTML et CSS.
            </p>

            <a href="http://google.sfr">Découvrir</a>
        </section>

        <section id="about" style="padding: 60px 20px; text-align: center;">
            <h2>À propos</h2>
            <p style="margin-top: 15px;">
                Vous pouvez présenter ici votre activité, votre projet ou votre entreprise.
            </p>
        </section>

        <section id="contact" style="padding: 60px 20px; text-align: center;">
            <h2>Contact</h2>
            <p style="margin-top: 15px;">
                Email : contact@monsite.fr
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mon Site - Tous droits réservés</p>
    </footer>

</body>
</html>
